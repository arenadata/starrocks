LOG_DIR = ${STARROCKS_HOME}/log

DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx1g -XX:+UseG1GC -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log"

sys_log_level = INFO

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
mysql_service_nio_enabled = true

# membership: the FEs know only the zookeeper ensemble; no seed list and no per-FE ordering.
# initial_state stays new on every FE: the cluster id recorded in zookeeper prevents a second cluster.
# no auth_token: the join token is published in the zookeeper token znode and read back from it.
fe_membership_provider = zookeeper
fe_membership_zookeeper_servers = zookeeper:2181
fe_cluster_initial_state = new
fe_membership_retry_interval_seconds = 2
