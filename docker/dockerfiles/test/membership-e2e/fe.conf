LOG_DIR = ${STARROCKS_HOME}/log

DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx1g -XX:+UseG1GC -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log"

sys_log_level = INFO

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
mysql_service_nio_enabled = true

# membership: every FE gets the same file, the first seed bootstraps the cluster
auth_token = membership-e2e-token
fe_membership_provider = embedded
fe_seed_nodes = fe1:9010,fe2:9010,fe3:9010
fe_cluster_initial_state = new
fe_membership_retry_interval_seconds = 2
