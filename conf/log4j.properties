# Configuration of log4j 1.x (reload4j) for the JVM that the BE/CN starts for libhdfs and the JNI scanners.
# hadoop-common ships reload4j, and commons-logging (used by Apache HttpClient, e.g. inside the AWS SDK of
# S3A) binds to it. Without a configuration its root logger stays at DEBUG, which turns on HttpClient wire
# logging: every byte read from object storage is formatted for a log line nobody sees.
# Everything else in that JVM logs through SLF4J to log4j2, see log4j2.properties.
log4j.rootLogger=WARN, stderr
log4j.logger.org.apache.http.wire=OFF
log4j.logger.org.apache.http.headers=OFF

log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=org.apache.log4j.PatternLayout
log4j.appender.stderr.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{2}: %m%n
